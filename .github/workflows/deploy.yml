name: deploy-dev

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy via SSH (git pull + write .env + compose up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/booking-pet-project

            git fetch --all
            git reset --hard origin/main

            docker compose up -d --build --remove-orphans
