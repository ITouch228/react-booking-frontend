name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact from CI run
        uses: actions/download-artifact@v4
        with:
          name: dist
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy atomically (releases + current symlink)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

          DEPLOY_BASE: /var/www/booking-pet-project
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RELEASE_DIR="${DEPLOY_BASE}/releases/${SHA}"
          CURRENT_LINK="${DEPLOY_BASE}/current"

          # 1) создать release dir
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${RELEASE_DIR}'"

          # 2) залить dist -> release dir
          rsync -az --delete "dist/" "${DEPLOY_USER}@${DEPLOY_HOST}:${RELEASE_DIR}/"

          # 3) атомарно переключить current -> release
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "ln -sfn '${RELEASE_DIR}' '${CURRENT_LINK}'"

          # 4) (опционально) чистка старых релизов, оставляем 5 последних
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${DEPLOY_BASE}/releases' && ls -1dt */ | tail -n +6 | xargs -r rm -rf"
